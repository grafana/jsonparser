name: CIFuzz
on: [pull_request]
jobs:
  Fuzzing:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@c12c5beeb500f846cb16839562c3edfd8a4bf095
      with:
        oss-fuzz-project-name: 'jsonparser'
        dry-run: false
        language: go
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@c12c5beeb500f846cb16839562c3edfd8a4bf095
      with:
        oss-fuzz-project-name: 'jsonparser'
        fuzz-seconds: 600
        dry-run: false
        language: go
    - name: Upload Crash
      uses: actions/upload-artifact@v1
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
